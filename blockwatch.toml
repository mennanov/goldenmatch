# Declarative cross-file and cross-language invariants enforced by blockwatch.
# Run locally with `blockwatch` (or via pre-commit); inspect any rule with
# `blockwatch explain <file>:<block-name>`.

# ============================================================================
# 1. Python package version lockstep (packages/python/*, dbt, duckdb)
# ============================================================================

# Every `version` under server.json `packages[]`, however many entries it has.
[[block]]
name = 'server-package-versions'
target = 'packages/python/{goldenanalysis,goldencheck,goldenflow,goldenmatch,goldenpipe,infermap}/server.json#/packages'
same-as-pattern = '"version":\s*"(?P<value>[^"]+)"'

[[block]]
name = 'version'
target = 'packages/python/goldenmatch/pyproject.toml#/project/version'
same-as = '''
packages/python/goldenmatch/goldenmatch/__init__.py#/__version__,
packages/python/goldenmatch/server.json#/version,
packages/python/goldenmatch/server.json:server-package-versions
'''
same-as-mode = 'set'

[[block]]
name = 'version'
target = 'packages/python/goldencheck/pyproject.toml#/project/version'
same-as = '''
