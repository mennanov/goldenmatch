# ============================================================================
# 3. TypeScript package version lockstep (packages/typescript/*)
# ============================================================================
#
# A version literal is `const VERSION = "x.y.z"`, `.version("x.y.z")` or
# `version: "x.y.z"` (three-part semver only, so MCP `protocolVersion` dates and
# schema tags never match). Every source file that has one must agree with its
# package.json; `target-if` skips the files that have none, so a literal added
# in a NEW file is checked without a new rule.

[[block]]
name = 'version'
target = 'packages/typescript/goldenanalysis/package.json#/version'

[[block]]
name = 'src-version'
target = 'packages/typescript/goldenanalysis/src/**/*.ts'
target-if = { patterns = ['''(?:(?:export[ \t]+)?const[ \t]+VERSION[ \t]*=[ \t]*|\.version\([ \t]*|\bversion:[ \t]*)["']\d+\.\d+\.\d+["']'''] }
same-as = 'packages/typescript/goldenanalysis/package.json:version'
same-as-pattern = '''(?:(?:export[ \t]+)?const[ \t]+VERSION[ \t]*=[ \t]*|\.version\([ \t]*|\bversion:[ \t]*)["'](?P<value>\d+\.\d+\.\d+)["']'''

[[block]]
name = 'version'
target = 'packages/typescript/goldencheck/package.json#/version'

[[block]]
name = 'src-version'
target = 'packages/typescript/goldencheck/src/**/*.ts'
target-if = { patterns = ['''(?:(?:export[ \t]+)?const[ \t]+VERSION[ \t]*=[ \t]*|\.version\([ \t]*|\bversion:[ \t]*)["']\d+\.\d+\.\d+["']'''] }
same-as = 'packages/typescript/goldencheck/package.json:version'
same-as-pattern = '''(?:(?:export[ \t]+)?const[ \t]+VERSION[ \t]*=[ \t]*|\.version\([ \t]*|\bversion:[ \t]*)["'](?P<value>\d+\.\d+\.\d+)["']'''

[[block]]
name = 'version'
target = 'packages/typescript/goldenflow/package.json#/version'

[[block]]
name = 'src-version'
target = 'packages/typescript/goldenflow/src/**/*.ts'
target-if = { patterns = ['''(?:(?:export[ \t]+)?const[ \t]+VERSION[ \t]*=[ \t]*|\.version\([ \t]*|\bversion:[ \t]*)["']\d+\.\d+\.\d+["']'''] }
same-as = 'packages/typescript/goldenflow/package.json:version'
same-as-pattern = '''(?:(?:export[ \t]+)?const[ \t]+VERSION[ \t]*=[ \t]*|\.version\([ \t]*|\bversion:[ \t]*)["'](?P<value>\d+\.\d+\.\d+)["']'''

[[block]]
name = 'version'
target = 'packages/typescript/goldenmatch/package.json#/version'

[[block]]
name = 'src-version'
target = 'packages/typescript/goldenmatch/src/**/*.ts'
target-if = { patterns = ['''(?:(?:export[ \t]+)?const[ \t]+VERSION[ \t]*=[ \t]*|\.version\([ \t]*|\bversion:[ \t]*)["']\d+\.\d+\.\d+["']'''] }
same-as = 'packages/typescript/goldenmatch/package.json:version'
same-as-pattern = '''(?:(?:export[ \t]+)?const[ \t]+VERSION[ \t]*=[ \t]*|\.version\([ \t]*|\bversion:[ \t]*)["'](?P<value>\d+\.\d+\.\d+)["']'''

[[block]]
name = 'version'
target = 'packages/typescript/goldenpipe/package.json#/version'

[[block]]
name = 'src-version'
target = 'packages/typescript/goldenpipe/src/**/*.ts'
target-if = { patterns = ['''(?:(?:export[ \t]+)?const[ \t]+VERSION[ \t]*=[ \t]*|\.version\([ \t]*|\bversion:[ \t]*)["']\d+\.\d+\.\d+["']'''] }
same-as = 'packages/typescript/goldenpipe/package.json:version'
same-as-pattern = '''(?:(?:export[ \t]+)?const[ \t]+VERSION[ \t]*=[ \t]*|\.version\([ \t]*|\bversion:[ \t]*)["'](?P<value>\d+\.\d+\.\d+)["']'''

[[block]]
name = 'version'
target = 'packages/typescript/infermap/package.json#/version'

[[block]]
name = 'src-version'
target = 'packages/typescript/infermap/src/**/*.ts'
target-if = { patterns = ['''(?:(?:export[ \t]+)?const[ \t]+VERSION[ \t]*=[ \t]*|\.version\([ \t]*|\bversion:[ \t]*)["']\d+\.\d+\.\d+["']'''] }
same-as = 'packages/typescript/infermap/package.json:version'
same-as-pattern = '''(?:(?:export[ \t]+)?const[ \t]+VERSION[ \t]*=[ \t]*|\.version\([ \t]*|\bversion:[ \t]*)["'](?P<value>\d+\.\d+\.\d+)["']'''

# These packages hardcode no version today. The first literal fails here; move
# the package to a `src-version` rule above when that happens.
[[block]]
name = 'no-version-literal'
target = 'packages/typescript/{goldencheck-types,goldengraph,goldenmatch-wasm-runtime,goldenprofile}/src/**/*.ts'
line-pattern-forbidden = '''(?:(?:export[ \t]+)?const[ \t]+VERSION[ \t]*=[ \t]*|\.version\([ \t]*|\bversion:[ \t]*)["']\d+\.\d+\.\d+["']'''

# ============================================================================
# 4. Postgres extension (goldenmatch_pg): version, pgrx pin, CI SQL copy list
#    (#[pg_extern] <-> base SQL parity stays in scripts/check_pgrx_sql_sync.py:
#    it follows the attribute and the current default_version, which a
#    per-line pattern over a fixed file list cannot.)
# ============================================================================

[[block]]
name = 'default-version'
target = 'packages/rust/extensions/postgres/goldenmatch_pg.control'
target-pattern = "^default_version = '(?P<value>[^']+)'"

[[block]]
name = 'version'
target = 'packages/rust/extensions/postgres/Cargo.toml#/package/version'
same-as = '''
packages/rust/extensions/postgres/goldenmatch_pg.control:default-version,
packages/rust/extensions/postgres/Cargo.lock#/package/~[name=goldenmatch_pg]/version
'''

[[block]]
name = 'pgrx-pin-ci'
target = '.github/workflows/ci.yml#/jobs/rust_pgrx/steps/~[name=Install cargo-pgrx]/run'
same-as-pattern = 'cargo install cargo-pgrx --version "(?P<value>[0-9.]+)"'

[[block]]
name = 'pgrx-pin-publish'
target = '.github/workflows/publish-goldenmatch-pg.yml#/jobs/build/steps/~[name=Install cargo-pgrx]/run'
same-as-pattern = 'cargo install cargo-pgrx --version "(?P<value>[0-9.]+)"'

[[block]]
name = 'pgrx-pin-docker'
target = 'packages/rust/extensions/Dockerfile'
target-pattern = 'cargo install cargo-pgrx --version "(?P<value>[0-9.]+)"'

[[block]]
name = 'pgrx-pin'
target = 'packages/rust/extensions/postgres/Cargo.toml#/dependencies/pgrx'
same-as = '''
packages/rust/extensions/postgres/Cargo.toml#/dev-dependencies/pgrx-tests,
.github/workflows/ci.yml:pgrx-pin-ci,
packages/rust/extensions/Dockerfile:pgrx-pin-docker,
.github/workflows/publish-goldenmatch-pg.yml:pgrx-pin-publish
'''

[[block]]
name = 'pgrx-sql-cp-list'
target = '.github/workflows/ci.yml#/jobs/rust_pgrx/steps/~[name=Build + install extension]/run'
same-as-paths = 'packages/rust/extensions/postgres/sql/goldenmatch_pg--*.sql'
same-as-pattern = 'goldenmatch_pg--(?P<value>[0-9.]+(?:--[0-9.]+)?\.sql)'

