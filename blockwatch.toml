# ============================================================================
# 6. blockwatch's own pin (CI, pre-commit, CONTRIBUTING.md)
# ============================================================================

[[block]]
name = 'blockwatch-pin-pre-commit'
target = '.pre-commit-config.yaml'
target-pattern = '(?s)mennanov/blockwatch\n\s+rev: [0-9a-f]{40}\s+# v(?P<value>[0-9.]+)'

[[block]]
name = 'blockwatch-pin-contributing'
target = 'CONTRIBUTING.md'
target-pattern = 'blockwatch-cli==(?P<value>[0-9.]+)'

[[block]]
name = 'blockwatch-pin'
target = '.github/workflows/ci.yml'
target-pattern = 'pip install blockwatch-cli==(?P<value>[0-9.]+)'
same-as = '''
.pre-commit-config.yaml:blockwatch-pin-pre-commit,
CONTRIBUTING.md:blockwatch-pin-contributing
'''
